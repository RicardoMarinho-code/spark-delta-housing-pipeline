# docker compose run --rm app housing generate-data
# docker compose run --rm app housing pipeline
# docker compose run --rm app housing publish
# docker compose run --rm app pytest
services:
  app:
    build: .
    image: housing-lakehouse:dev
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - path: .env
        required: false
    environment:
      MONGO_URI: mongodb://mongo:27017
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
