[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "housing-lakehouse"
version = "0.1.0"
description = "CadÚnico × social housing lakehouse: privacy by design, data quality, observability and ML"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "delta-spark>=3.2",
    "pyspark>=3.5",
    "pyarrow>=15",
    "pandas>=2.1,<3",  # PySpark does not fully support pandas 3 yet
    "pyyaml>=6",
]

[project.optional-dependencies]
synthetic = ["faker>=24"]
ml = ["scikit-learn>=1.4", "scipy>=1.11", "mlflow-skinny>=2.12"]
publishing = ["pymongo>=4.6"]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "faker>=24",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "pymongo>=4.6",
]

[project.scripts]
housing = "housing_lakehouse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
housing_lakehouse = ["conf/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["spark: needs Java + Spark (runs in CI on Linux)"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
